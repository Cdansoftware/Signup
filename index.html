<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation - Accio Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #000;
            border-radius: 6px;
            outline: none;
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }

        .success-message {
            color: green;
            font-size: 13px;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 20px;
            font-size: 14px;
            background-color: #fff;
            border: 1px solid #000;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <form id="signupForm">
            <!-- Email Input Group -->
            <div class="input-group">
                <label for="email">Email</label>
                <input 
                    type="text" 
                    id="email" 
                    placeholder="Example@email.com" 
                    oninput="validateEmail()"
                >
                <div id="emailError" class="error-message"></div>
            </div>

            <!-- Password Input Group -->
            <div class="input-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Your Password" 
                    oninput="validatePassword()"
                >
                <div id="passwordError" class="error-message"></div>
            </div>

            <!-- Green Success Message -->
            <div id="successMessage" class="success-message"></div>

            <!-- Submit Button -->
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');
        const form = document.getElementById('signupForm');

        let isEmailValid = false;
        let isPasswordValid = false;

        // Function to validate Email
        function validateEmail() {
            const emailValue = emailInput.value.trim();

            if (emailValue.length > 3 && emailValue.includes('@') && emailValue.includes('.')) {
                emailError.textContent = '';
                isEmailValid = true;
            } else {
                emailError.textContent = 'Make sure email is more than 3 characters and has @ and a .';
                isEmailValid = false;
            }

            checkOverallValidation();
        }

        // Function to validate Password
        function validatePassword() {
            const passwordValue = passwordInput.value;

            if (passwordValue.length > 8) {
                passwordError.textContent = '';
                isPasswordValid = true;
            } else {
                passwordError.textContent = 'Make sure password is more than 8 characters.';
                isPasswordValid = false;
            }

            checkOverallValidation();
        }

        // Check if both validations pass to display "All good to go"
        function checkOverallValidation() {
            if (isEmailValid && isPasswordValid) {
                successMessage.textContent = 'All good to go!';
            } else {
                successMessage.textContent = '';
            }
        }

        // Handle Form Submission
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default page refresh

            if (isEmailValid && isPasswordValid) {
                const userConfirmed = confirm('Are you sure you want to submit?');

                if (userConfirmed) {
                    alert('Successful signup!');
                } else {
                    // Reset form and clear inputs/messages
                    form.reset();
                    isEmailValid = false;
                    isPasswordValid = false;
                    emailError.textContent = '';
                    passwordError.textContent = '';
                    successMessage.textContent = '';
                }
            }
        });
    </script>

</body>
</html>
